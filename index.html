<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      display: none;
    }

    .success {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
    }

    .warning {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
    }

    .error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .result-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .data-row {
      margin: 7px 0;
    }

    .data-label {
      font-weight: bold;
    }

    .bridge-status {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>PoC QR CHECK-IN</h1>

    <div class="subtitle">
      Panel Petugas
    </div>

    <!--
      INPUT MANUAL
      Tetap dipertahankan sebagai backup.
    -->

    <label for="token">
      QR Token
    </label>

    <input
      id="token"
      type="text"
      placeholder="Masukkan QR Token"
      autocomplete="off"
    >

    <button id="checkButton" onclick="manualCheckIn()">
      CHECK-IN
    </button>

    <div
      id="result"
      class="result">
    </div>

    <div
      id="bridgeStatus"
      class="bridge-status">
      Menunggu scanner...
    </div>

  </div>

</div>


<script>

/* =========================================================
   BRIDGE DARI GITHUB PAGES SCANNER
   ========================================================= */

window.addEventListener('message', function(event) {

  /*
   * Hanya menerima pesan dari GitHub Pages kita.
   */
  if (
    event.origin !==
    'https://register-qrcode.github.io'
  ) {
    return;
  }

  /*
   * Pastikan pesan berasal dari parent window.
   */
  if (event.source !== window.parent) {
    return;
  }

  var data = event.data || {};

  if (data.type !== 'QR_SCANNED') {
    return;
  }

  var token = String(data.token || '').trim();

  if (!token) {
    sendResultToScanner({
      status: 'INVALID',
      message: 'QR Token kosong.'
    });
    return;
  }

  document.getElementById('bridgeStatus').innerText =
    'QR diterima. Memeriksa data...';

  /*
   * Kirim token ke Apps Script server.
   */
  google.script.run

    .withSuccessHandler(function(result) {

      document.getElementById('bridgeStatus').innerText =
        'Pemeriksaan selesai.';

      sendResultToScanner(result);

    })

    .withFailureHandler(function(error) {

      var message =
        error && error.message
          ? error.message
          : 'Terjadi kesalahan pada server.';

      sendResultToScanner({
        status: 'ERROR',
        message: message
      });

    })

    .processCameraData(token);

});


/* =========================================================
   KIRIM HASIL KEMBALI KE GITHUB PAGES
   ========================================================= */

function sendResultToScanner(result) {

  window.parent.postMessage(
    {
      type: 'CHECKIN_RESULT',
      result: result
    },
    'https://register-qrcode.github.io'
  );

}


/* =========================================================
   MANUAL CHECK-IN
   ========================================================= */

function manualCheckIn() {

  var token =
    document.getElementById('token').value.trim();

  if (!token) {

    showResult({
      status: 'INVALID',
      message: 'Silakan masukkan QR Token.'
    });

    return;
  }

  var button =
    document.getElementById('checkButton');

  button.disabled = true;
  button.innerText = 'MEMERIKSA...';

  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.innerText = 'CHECK-IN';

      showResult(result);

    })

    .withFailureHandler(function(error) {

      button.disabled = false;
      button.innerText = 'CHECK-IN';

      showResult({
        status: 'ERROR',
        message:
          error && error.message
            ? error.message
            : 'Terjadi kesalahan.'
      });

    })

    .processCameraData(token);

}


/* =========================================================
   TAMPILKAN HASIL
   ========================================================= */

function showResult(result) {

  var box =
    document.getElementById('result');

  if (!result) {

    box.className =
      'result error';

    box.innerHTML =
      '<div class="result-title">ERROR</div>' +
      '<div>Hasil pemeriksaan kosong.</div>';

    box.style.display = 'block';

    return;
  }


  /* ==========================================
     CHECK-IN BERHASIL
     ========================================== */

  if (
    result.status === 'CHECKED_IN' ||
    result.status === 'SUCCESS'
  ) {

    box.className =
      'result success';

    box.innerHTML =

      '<div class="result-title">' +
      'CHECK-IN BERHASIL' +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Nama:</span> ' +
      escapeHtml(result.name || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Instansi:</span> ' +
      escapeHtml(result.institution || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Registration ID:</span> ' +
      escapeHtml(result.registrationId || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Check-in:</span> ' +
      escapeHtml(result.checkInTime || '-') +
      '</div>';

    box.style.display = 'block';

    return;
  }


  /* ==========================================
     SUDAH CHECK-IN SEBELUMNYA
     ========================================== */

  if (
    result.status === 'ALREADY_CHECKED_IN'
  ) {

    box.className =
      'result warning';

    box.innerHTML =

      '<div class="result-title">' +
      'SUDAH CHECK-IN' +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Nama:</span> ' +
      escapeHtml(result.name || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Instansi:</span> ' +
      escapeHtml(result.institution || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Registration ID:</span> ' +
      escapeHtml(result.registrationId || '-') +
      '</div>' +

      '<div class="data-row">' +
      '<span class="data-label">Check-in sebelumnya:</span> ' +
      escapeHtml(result.checkInTime || '-') +
      '</div>';

    box.style.display = 'block';

    return;
  }


  /* ==========================================
     QR TIDAK VALID
     ========================================== */

  if (
    result.status === 'INVALID' ||
    result.status === 'INVALID_STATUS'
  ) {

    box.className =
      'result error';

    box.innerHTML =

      '<div class="result-title">' +
      'QR TIDAK VALID' +
      '</div>' +

      '<div>' +
      escapeHtml(
        result.message ||
        'QR Code tidak dapat diverifikasi.'
      ) +
      '</div>';

    box.style.display = 'block';

    return;
  }


  /* ==========================================
     ERROR
     ========================================== */

  box.className =
    'result error';

  box.innerHTML =

    '<div class="result-title">' +
    'ERROR' +
    '</div>' +

    '<div>' +
    escapeHtml(
      result.message ||
      'Terjadi kesalahan.'
    ) +
    '</div>';

  box.style.display = 'block';

}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>
</html>
