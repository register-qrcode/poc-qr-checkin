<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PoC QR CHECK-IN</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container { max-width: 520px; margin: 0 auto; }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 { margin: 0 0 4px; font-size: 24px; }

    .subtitle {
      color: #6b7280;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .scanner-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #111827;
      min-height: 280px;
    }

    .instruction {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
      text-align: center;
      color: #4b5563;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .volume-row {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
    }

    .volume-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    #volumeSlider {
      width: 100%;
      accent-color: #111827;
    }

    .sound-button,
    .reset-button,
    .action-button {
      width: 100%;
      padding: 14px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sound-button {
      background: #e5e7eb;
      color: #111827;
    }

    .sound-button.active {
      background: #065f46;
      color: #ffffff;
    }

    .action-button {
      background: #374151;
      color: #ffffff;
      display: none;
      margin-top: 10px;
    }

    .result {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 12px;
    }

    .success {
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
    }

    .warning {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #991b1b;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .detail { margin: 6px 0; font-size: 15px; }

    .status {
      margin-top: 14px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      font-weight: bold;
    }

    .reset-button {
      margin-top: 12px;
      background: #111827;
      color: #ffffff;
      display: none;
      font-size: 16px;
      padding: 16px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>PoC QR CHECK-IN</h1>
    <div class="subtitle">Scanner Petugas</div>

    <div class="scanner-title">Scan QR Code Peserta</div>
    <div id="reader"></div>

    <div class="instruction">
      Arahkan QR ke kamera.<br>
      Aktifkan suara agar Gemini TTS memandu check-in.
    </div>

    <div class="controls">
      <button
        id="soundButton"
        class="sound-button"
        type="button"
      >
        AKTIFKAN SUARA
      </button>
      <button
        id="manualNextButton"
        class="sound-button"
        type="button"
        style="display:none;"
      >
        LANJUT SCAN
      </button>
    </div>

    <div class="volume-row">
      <div class="volume-label">
        <span>Volume</span>
        <span id="volumeValue">80%</span>
      </div>
      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="80"
        step="5"
      >
    </div>

    <button
      id="startButton"
      class="action-button"
      type="button"
    >
      AKTIFKAN KAMERA
    </button>

    <div id="result" class="result">
      <div id="resultTitle" class="result-title"></div>
      <div id="resultContent"></div>
    </div>

    <button
      id="resetButton"
      class="reset-button"
      type="button"
    >
      SCAN PESERTA BERIKUTNYA
    </button>

    <div id="status" class="status">
      Status: SIAP SCAN
    </div>
  </div>
</div>

<iframe
  id="appsScriptFrame"
  title="Apps Script bridge"
  src="https://script.google.com/macros/s/AKfycbwbLyCiePd1Vw3CgxBz0GdSDgaxTWI8Fsg7XUaKYJIOuqDK0qIEtgkINVVq0ZsFR_gCMg/exec"
  style="position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;"
></iframe>

<script>
const WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbwbLyCiePd1Vw3CgxBz0GdSDgaxTWI8Fsg7XUaKYJIOuqDK0qIEtgkINVVq0ZsFR_gCMg/exec';

const RESPONSE_TIMEOUT_MS = 12000;
// Hanya beep — tanpa TTS. Panel singkat lalu siap scan lagi.
const AUTO_NEXT_MS = 1200;
const SAME_TOKEN_COOLDOWN_MS = 1200;

let scanner = null;
let cameraRunning = false;
let cameraStarting = false;
let isProcessing = false;
let soundEnabled = false;
let soundVolume = 0.8;
let audioCtx = null;
let masterGain = null;
let responseTimer = null;
let autoNextTimer = null;
let geminiFallbackTimer = null;
let pendingSpeechText = '';
let lastToken = '';
let lastTokenAt = 0;
let beepAudioSuccess = null;
let beepAudioWarn = null;
let currentAudio = null;
let audioRequestId = 0;
let audioPlayedForRequest = 0;
let expectGeminiAudio = false;
let lastResultKey = '';
let geminiAudioPlayed = false;
let bridgeReady = false;
let pendingBridgeToken = '';

document.getElementById('soundButton').addEventListener('click', toggleSound);
document.getElementById('startButton').addEventListener('click', function () {
  enableSoundFromGesture();
  startScanner();
});
document.getElementById('resetButton').addEventListener('click', function () {
  enableSoundFromGesture();
  resetScanner();
});
document.getElementById('manualNextButton').addEventListener('click', function () {
  enableSoundFromGesture();
  resetScanner();
});
document.getElementById('volumeSlider').addEventListener('input', function (event) {
  soundVolume = Number(event.target.value) / 100;
  document.getElementById('volumeValue').innerText =
    Math.round(soundVolume * 100) + '%';

  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(
      Math.max(0.0001, soundVolume),
      audioCtx.currentTime
    );
  }

  if (beepAudioSuccess) beepAudioSuccess.volume = soundVolume;
  if (beepAudioWarn) beepAudioWarn.volume = Math.min(1, soundVolume);
  if (currentAudio) currentAudio.volume = soundVolume;

  // Moving the slider counts as user gesture — unlock + enable sound.
  if (!soundEnabled) {
    soundEnabled = true;
    const button = document.getElementById('soundButton');
    button.classList.add('active');
    button.innerText = 'SUARA AKTIF';
  }

  unlockAudio();
  playBeep('success');
});

// Jaga AudioContext tetap hidup di HP (sering suspend saat idle).
['pointerdown', 'touchstart', 'click'].forEach(function (evtName) {
  document.addEventListener(
    evtName,
    function () {
      if (soundEnabled) unlockAudio();
    },
    { passive: true }
  );
});

function setStatus(message) {
  document.getElementById('status').innerText = message;
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function isAllowedResultOrigin(origin) {
  if (!origin) return false;
  if (origin === 'https://script.google.com') return true;
  if (origin.indexOf('https://') !== 0) return false;
  return (
    origin.indexOf('.googleusercontent.com') !== -1 ||
    origin.indexOf('script.google.com') !== -1
  );
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const button = document.getElementById('soundButton');

  if (soundEnabled) {
    button.classList.add('active');
    button.innerText = 'SUARA AKTIF';
    unlockAudio();
    // Beep uji lokal — wajib terdengar setelah ketuk tombol.
    playBeep('success');
  } else {
    button.classList.remove('active');
    button.innerText = 'AKTIFKAN SUARA';
  }
}

function buildBeepWavDataUri(frequency, durationMs) {
  const sampleRate = 22050;
  const samples = Math.floor(sampleRate * durationMs / 1000);
  const dataSize = samples * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, value) {
    for (let i = 0; i < value.length; i++) {
      view.setUint8(offset + i, value.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  for (let i = 0; i < samples; i++) {
    const t = i / sampleRate;
    const envelope = Math.min(1, i / 200) * Math.min(1, (samples - i) / 400);
    const sample = Math.sin(2 * Math.PI * frequency * t) * envelope * 0.9;
    view.setInt16(44 + i * 2, sample * 0x7fff, true);
  }

  return wavBufferToDataUri(buffer);
}

/*
 * Suara FAILED khas: 3x buzz rendah (bzz-bzz-bzz), jelas beda dari beep sukses.
 */
function buildFailedWavDataUri() {
  const sampleRate = 22050;
  const durationMs = 700;
  const samples = Math.floor(sampleRate * durationMs / 1000);
  const dataSize = samples * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, value) {
    for (let i = 0; i < value.length; i++) {
      view.setUint8(offset + i, value.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  for (let i = 0; i < samples; i++) {
    const t = i / sampleRate;
    // 3 pulses: on 0-0.14, 0.22-0.36, 0.44-0.58
    const inPulse =
      (t >= 0 && t < 0.14) ||
      (t >= 0.22 && t < 0.36) ||
      (t >= 0.44 && t < 0.58);

    let sample = 0;
    if (inPulse) {
      // Harsh low buzz (square-ish)
      const saw = ((t * 180) % 1) * 2 - 1;
      const low = Math.sin(2 * Math.PI * 180 * t);
      sample = (saw * 0.55 + low * 0.45) * 0.95;
    }

    view.setInt16(44 + i * 2, sample * 0x7fff, true);
  }

  return wavBufferToDataUri(buffer);
}

function wavBufferToDataUri(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, i + chunk)
    );
  }
  return 'data:audio/wav;base64,' + btoa(binary);
}

function prepareHtmlAudio() {
  if (!beepAudioSuccess) {
    beepAudioSuccess = new Audio(buildBeepWavDataUri(1100, 180));
    beepAudioSuccess.preload = 'auto';
  }
  if (!beepAudioWarn) {
    beepAudioWarn = new Audio(buildFailedWavDataUri());
    beepAudioWarn.preload = 'auto';
  }

  beepAudioSuccess.volume = soundVolume;
  beepAudioWarn.volume = Math.min(1, soundVolume);
}

function unlockAudio() {
  try {
    prepareHtmlAudio();

    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
      if (!audioCtx) {
        audioCtx = new Ctx();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = Math.max(0.0001, soundVolume);
        masterGain.connect(audioCtx.destination);
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(masterGain || audioCtx.destination);
      source.start(0);
    }

    // Prime both success + failed clips on iOS/Android.
    [beepAudioSuccess, beepAudioWarn].forEach(function (clip) {
      if (!clip) return;
      clip.muted = true;
      const p = clip.play();
      if (p && p.then) {
        p.then(function () {
          clip.pause();
          clip.currentTime = 0;
          clip.muted = false;
        }).catch(function () {
          clip.muted = false;
        });
      } else {
        clip.muted = false;
      }
    });

    // Prime speechSynthesis saat gesture — async speak sering diblokir HP.
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      try {
        var prime = new SpeechSynthesisUtterance(' ');
        prime.volume = 0;
        prime.rate = 2;
        window.speechSynthesis.speak(prime);
        window.speechSynthesis.cancel();
      } catch (ePrime) {}
    }
  } catch (error) {
    console.log('Audio unlock:', error);
  }
}

function speakLocalIndonesian(text, force) {
  if ((!soundEnabled && !force) || soundVolume <= 0) return;
  text = String(text || '').trim();
  if (!text || !window.speechSynthesis) return;

  try {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    window.speechSynthesis.cancel();

    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'id-ID';
    utter.rate = 1;
    utter.pitch = 1.05;
    utter.volume = Math.max(0.2, Math.min(1, soundVolume));

    var voices = window.speechSynthesis.getVoices() || [];
    var pick =
      voices.find(function (v) {
        return (
          v.lang &&
          v.lang.toLowerCase().indexOf('id') === 0 &&
          /female|wanita|woman|girl/i.test(v.name || '')
        );
      }) ||
      voices.find(function (v) {
        return /female|wanita|woman|zira|samantha|karen|moira|fiona/i.test(
          v.name || ''
        );
      }) ||
      voices.find(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf('id') === 0;
      });
    if (pick) utter.voice = pick;

    window.speechSynthesis.speak(utter);
  } catch (error) {
    console.log('speakLocalIndonesian error:', error);
  }
}

function clearGeminiFallbackTimer() {
  if (geminiFallbackTimer) {
    clearTimeout(geminiFallbackTimer);
    geminiFallbackTimer = null;
  }
}

/** Hanya beep hasil scan — tanpa TTS / ucapan. */
function playImmediateResultFeedback(kind) {
  if (!soundEnabled || soundVolume <= 0) return;

  try {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  } catch (e) {}

  clearGeminiFallbackTimer();
  expectGeminiAudio = false;
  pendingSpeechText = '';
  geminiAudioPlayed = false;
  playBeep(kind);
}

function playBeepWebAudio(kind) {
  if (!audioCtx || !masterGain) return;

  const now = audioCtx.currentTime;
  const peak = Math.max(0.08, soundVolume * 0.95);

  function tone(type, freq, startOffset, length) {
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const start = now + startOffset;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + length);

    oscillator.connect(gain);
    gain.connect(masterGain);
    oscillator.start(start);
    oscillator.stop(start + length + 0.02);
  }

  if (kind === 'warn' || kind === 'failed') {
    // Triple low buzz = FAILED
    tone('square', 180, 0, 0.12);
    tone('square', 160, 0.18, 0.12);
    tone('square', 140, 0.36, 0.14);
  } else {
    // Success: high ding-ding
    tone('sine', 988, 0, 0.12);
    tone('sine', 1319, 0.12, 0.16);
  }
}

function playBeep(kind) {
  if (!soundEnabled || soundVolume <= 0) return;

  try {
    prepareHtmlAudio();

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    // WebAudio dulu — paling andal setelah unlock di HP (async postMessage).
    playBeepWebAudio(kind === 'warn' || kind === 'failed' ? 'failed' : 'success');

    const audio = (kind === 'warn' || kind === 'failed')
      ? beepAudioWarn
      : beepAudioSuccess;

    if (!audio) return;

    audio.pause();
    audio.currentTime = 0;
    audio.muted = false;
    audio.volume = Math.max(0, Math.min(1, soundVolume));

    const playPromise = audio.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function () {
        playBeepWebAudio(kind);
      });
    }
  } catch (error) {
    console.log('Beep error:', error);
    try {
      playBeepWebAudio(kind);
    } catch (e2) {
      console.log('WebAudio fallback error:', e2);
    }
  }
}

function speakFailed() {
  if (!soundEnabled || soundVolume <= 0) return;
  if (!window.speechSynthesis) return;

  try {
    window.speechSynthesis.cancel();

    const speak = function () {
      const utter = new SpeechSynthesisUtterance('Failed');
      utter.lang = 'en-US';
      utter.rate = 0.95;
      utter.pitch = 0.7;
      utter.volume = Math.max(0, Math.min(1, soundVolume));

      const voices = window.speechSynthesis.getVoices() || [];
      const en = voices.find(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf('en') === 0;
      });
      if (en) utter.voice = en;

      window.speechSynthesis.speak(utter);
    };

    // Some browsers load voices async.
    if ((window.speechSynthesis.getVoices() || []).length === 0) {
      window.speechSynthesis.onvoiceschanged = function () {
        window.speechSynthesis.onvoiceschanged = null;
        speak();
      };
      setTimeout(speak, 120);
    } else {
      speak();
    }
  } catch (error) {
    console.log('Speech error:', error);
  }
}

function beginNewScanCycle() {
  // Jangan clear expectGeminiAudio / lastResultKey di sini —
  // re-scan QR yang sama sering datang sebelum TTS selesai (3–13 dtk).
  audioRequestId += 1;
}

function enableSoundFromGesture() {
  soundEnabled = true;
  var button = document.getElementById('soundButton');
  if (button) {
    button.classList.add('active');
    button.innerText = 'SUARA AKTIF';
  }
  unlockAudio();
}

function formatCheckInTime(value) {
  var raw = String(value || '').trim();
  if (!raw || raw === '-') return '-';

  // Ambil HH:mm:ss jika ada di string tanggal.
  var match = raw.match(/(\d{1,2}:\d{2}:\d{2})/);
  if (match) return match[1];

  return raw;
}

function stopCurrentAudio() {
  if (currentAudio) {
    try {
      currentAudio.pause();
      currentAudio.removeAttribute('src');
      currentAudio.load();
    } catch (e) {}
    currentAudio = null;
  }
}

function playGeminiWavBase64(wavBase64) {
  if (!wavBase64) return;

  try {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    // Hentikan suara lokal agar diganti Gemini jika berhasil.
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
    stopCurrentAudio();

    var binary = atob(wavBase64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    // Prefer WebAudio decode — lebih tahan blokir autoplay di HP.
    if (audioCtx && audioCtx.decodeAudioData) {
      audioCtx.decodeAudioData(
        bytes.buffer.slice(0),
        function (buffer) {
          var source = audioCtx.createBufferSource();
          source.buffer = buffer;
          if (masterGain) {
            masterGain.gain.value = Math.max(0.0001, soundVolume);
            source.connect(masterGain);
          } else {
            source.connect(audioCtx.destination);
          }
          source.start(0);
        },
        function () {
          playGeminiViaHtmlAudio_(wavBase64);
        }
      );
      return;
    }

    playGeminiViaHtmlAudio_(wavBase64);
  } catch (error) {
    console.log('playGeminiWavBase64 error:', error);
    playGeminiViaHtmlAudio_(wavBase64);
  }
}

function playGeminiViaHtmlAudio_(wavBase64) {
  try {
    var audio = new Audio('data:audio/wav;base64,' + wavBase64);
    audio.volume = Math.max(0, Math.min(1, soundVolume));
    currentAudio = audio;
    var playPromise = audio.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function (error) {
        console.log(
          'Gemini audio play blocked/failed (check-in tetap valid):',
          error
        );
      });
    }
  } catch (error) {
    console.log('playGeminiViaHtmlAudio_ error:', error);
  }
}

function buildSuccessSpeechText(name) {
  return 'Check-in berhasil. ' + String(name || '').trim() + '.';
}

function buildDuplicateSpeechText(name) {
  return 'Sudah dipakai check-in oleh ' + String(name || '').trim() + '.';
}

function vibrateSuccess() {
  if (navigator.vibrate) {
    navigator.vibrate([90, 50, 90]);
  }
}

function vibrateWarn() {
  if (navigator.vibrate) {
    navigator.vibrate([40, 30, 40]);
  }
}

function clearResponseTimer() {
  if (responseTimer) {
    clearTimeout(responseTimer);
    responseTimer = null;
  }
}

function clearAutoNextTimer() {
  if (autoNextTimer) {
    clearTimeout(autoNextTimer);
    autoNextTimer = null;
  }
}

function showStartButton(show) {
  document.getElementById('startButton').style.display =
    show ? 'block' : 'none';
}

function showResult(type, title, content) {
  const result = document.getElementById('result');
  document.getElementById('resultTitle').innerHTML = title;
  document.getElementById('resultContent').innerHTML = content;
  result.className = 'result ' + type;
  result.style.display = 'block';
  document.getElementById('resetButton').style.display = 'block';
  document.getElementById('manualNextButton').style.display = 'block';

  // Kunci scan selama panel hasil tampil supaya re-scan tidak menghapus teks/TTS.
  isProcessing = true;

  clearAutoNextTimer();
  autoNextTimer = setTimeout(function () {
    hideResultPanel();
    isProcessing = false;
    setStatus('Status: SIAP SCAN');
  }, AUTO_NEXT_MS);
}

function hideResultPanel() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('resetButton').style.display = 'none';
  document.getElementById('manualNextButton').style.display = 'none';
}

function cameraErrorMessage(error) {
  const text = String(
    (error && (error.name || error.message)) || error || ''
  ).toLowerCase();

  if (
    text.indexOf('notallowed') !== -1 ||
    text.indexOf('permission') !== -1 ||
    text.indexOf('denied') !== -1
  ) {
    return 'Izin kamera ditolak. Izinkan kamera, lalu ketuk AKTIFKAN KAMERA.';
  }

  if (
    text.indexOf('notfound') !== -1 ||
    text.indexOf('devices not found') !== -1
  ) {
    return 'Kamera tidak tersedia pada perangkat ini.';
  }

  if (
    text.indexOf('notreadable') !== -1 ||
    text.indexOf('trackstart') !== -1 ||
    text.indexOf('in use') !== -1
  ) {
    return 'Kamera sedang dipakai aplikasi lain.';
  }

  if (window.isSecureContext === false) {
    return 'Kamera membutuhkan HTTPS.';
  }

  return 'Kamera tidak dapat digunakan. Ketuk AKTIFKAN KAMERA.';
}

function startScanner() {
  showStartButton(false);

  if (cameraRunning && scanner) {
    readyForNextScan();
    return;
  }

  beginCamera();
}

function beginCamera() {
  if (cameraStarting || cameraRunning) return;

  if (typeof Html5Qrcode === 'undefined') {
    setStatus('Status: Library scanner gagal dimuat.');
    showStartButton(true);
    return;
  }

  cameraStarting = true;

  if (!scanner) {
    scanner = new Html5Qrcode('reader');
  }

  const config = {
    fps: 20,
    qrbox: function (viewfinderWidth, viewfinderHeight) {
      const edge = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);
      return { width: edge, height: edge };
    },
    aspectRatio: 1.0
  };

  setStatus('Status: Meminta izin kamera...');

  scanner
    .start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      onScanError
    )
    .then(function () {
      cameraStarting = false;
      cameraRunning = true;
      isProcessing = false;
      setStatus('Status: SIAP SCAN');
    })
    .catch(function (error) {
      console.error(error);
      cameraStarting = false;
      cameraRunning = false;
      setStatus('Status: ' + cameraErrorMessage(error));
      showStartButton(true);
    });
}

/*
 * Kamera TETAP NYALA antar peserta.
 * Hanya buka kunci flag agar QR berikutnya bisa diproses.
 */
function readyForNextScan() {
  clearAutoNextTimer();
  clearResponseTimer();
  isProcessing = false;
  hideResultPanel();
  // Jangan stop audio di sini — biarkan TTS selesai kecuali scan baru mulai.

  if (!cameraRunning) {
    beginCamera();
    return;
  }

  setStatus('Status: SIAP SCAN');
}

function onScanSuccess(decodedText) {
  if (isProcessing || !cameraRunning) return;

  const token = String(decodedText || '').trim();
  if (!token) return;

  const now = Date.now();
  if (token === lastToken && now - lastTokenAt < SAME_TOKEN_COOLDOWN_MS) {
    return;
  }

  lastToken = token;
  lastTokenAt = now;
  isProcessing = true;
  beginNewScanCycle();

  setStatus('Status: QR terbaca. Memeriksa data...');
  sendTokenToAppsScript(token);
}

function onScanError() {
  // Ignore continuous miss events.
}

function sendTokenToAppsScript(token) {
  if (!navigator.onLine) {
    handleCheckInResult({
      status: 'ERROR',
      message: 'Tidak ada koneksi internet. Silakan coba lagi.'
    });
    return;
  }

  const frame = document.getElementById('appsScriptFrame');
  if (!frame) {
    handleCheckInResult({
      status: 'ERROR',
      message: 'Koneksi ke sistem check-in tidak tersedia.'
    });
    return;
  }

  clearResponseTimer();
  responseTimer = setTimeout(function () {
    handleCheckInResult({
      status: 'ERROR',
      message: 'Gagal terhubung ke server. Silakan coba lagi.'
    });
  }, RESPONSE_TIMEOUT_MS);

  // Bridge cepat: kirim token tanpa reload iframe (hindari jeda cold-start).
  if (bridgeReady && frame.contentWindow) {
    try {
      frame.contentWindow.postMessage(
        { type: 'CHECKIN_REQUEST', token: token },
        '*'
      );
      return;
    } catch (ePost) {
      console.log('Bridge postMessage gagal, fallback reload:', ePost);
    }
  }

  // Bridge belum siap: fallback URL ?token= (tetap andal).
  sendTokenViaUrlFallback(token);
}

function sendTokenViaUrlFallback(token) {
  const frame = document.getElementById('appsScriptFrame');
  if (!frame) return;
  frame.src =
    WEB_APP_URL +
    '?token=' +
    encodeURIComponent(token) +
    '&_=' +
    Date.now();
}

window.addEventListener('message', function (event) {
  if (!event.data || !event.data.type) {
    return;
  }

  if (!isAllowedResultOrigin(event.origin)) {
    return;
  }

  if (event.data.type === 'BRIDGE_READY') {
    bridgeReady = true;
    if (pendingBridgeToken) {
      var queued = pendingBridgeToken;
      pendingBridgeToken = '';
      try {
        var frameReady = document.getElementById('appsScriptFrame');
        if (frameReady && frameReady.contentWindow) {
          frameReady.contentWindow.postMessage(
            { type: 'CHECKIN_REQUEST', token: queued },
            '*'
          );
          return;
        }
      } catch (eReady) {}
      sendTokenViaUrlFallback(queued);
    }
    return;
  }

  if (event.data.type === 'CHECKIN_RESULT') {
    handleCheckInResult(event.data.result);
    return;
  }

  // TTS dimatikan: abaikan audio Gemini (hanya beep di UI).
  if (event.data.type === 'CHECKIN_AUDIO' || event.data.type === 'CHECKIN_AUDIO_ERROR') {
    clearGeminiFallbackTimer();
    expectGeminiAudio = false;
    return;
  }
});

function handleCheckInAudio(audio) {
  if (!audio || !audio.wavBase64) return;

  var key = audio.resultKey ? String(audio.resultKey) : '';

  // Utamakan resultKey: TTS boleh datang terlambat setelah panel hasil.
  if (key && lastResultKey && key === lastResultKey) {
    if (audioPlayedForRequest === key) {
      console.log('Ignore duplicate Gemini audio for same resultKey.');
      return;
    }
    audioPlayedForRequest = key;
    expectGeminiAudio = false;
    geminiAudioPlayed = true;
    clearGeminiFallbackTimer();
    unlockAudio();
    playGeminiWavBase64(audio.wavBase64);
    return;
  }

  if (!expectGeminiAudio) {
    console.log('Ignore stale Gemini audio (no pending result).');
    return;
  }

  if (key && lastResultKey && key !== lastResultKey) {
    console.log('Ignore stale Gemini audio (resultKey mismatch).');
    return;
  }

  if (audioPlayedForRequest === audioRequestId) {
    console.log('Ignore duplicate Gemini audio for same scan.');
    return;
  }

  audioPlayedForRequest = audioRequestId;
  expectGeminiAudio = false;
  geminiAudioPlayed = true;
  clearGeminiFallbackTimer();

  unlockAudio();
  playGeminiWavBase64(audio.wavBase64);
}

function handleCheckInResult(result) {
  clearResponseTimer();
  isProcessing = true;
  stopCurrentAudio();
  unlockAudio();

  expectGeminiAudio = false;
  lastResultKey = '';

  if (!result) {
    showResult(
      'error',
      '✕ CHECK-IN TIDAK BERHASIL',
      'Tidak ada respons dari server.'
    );
    setStatus('Status: Gagal · siap scan berikutnya');
    playBeep('failed');
    return;
  }

  if (result.status === 'CHECKED_IN' || result.status === 'SUCCESS') {
    var successName = result.name || '-';
    var successInstansi = result.institution || '-';
    var successTime = formatCheckInTime(result.checkInTime);

    var successContent =
      '<div class="detail" style="text-align:center;font-size:20px;font-weight:bold;margin:10px 0;">' +
      escapeHtml(successName) +
      '</div>' +
      '<div class="detail" style="text-align:center;">' +
      escapeHtml(successInstansi) +
      '</div>' +
      '<div class="detail" style="text-align:center;margin-top:12px;">' +
      escapeHtml(successTime) +
      '</div>';

    showResult('success', '✓ CHECK-IN BERHASIL', successContent);
    setStatus('Status: BERHASIL · siap scan berikutnya');
    vibrateSuccess();

    lastResultKey =
      'CHECKED_IN|' +
      String(result.registrationId || '') +
      '|' +
      String(successName);
    playImmediateResultFeedback('success');
    return;
  }

  if (result.status === 'ALREADY_CHECKED_IN') {
    var dupName = result.name || '-';
    var dupInstansi = result.institution || '-';
    var dupTime = formatCheckInTime(result.checkInTime);

    var dupContent =
      '<div class="detail" style="text-align:center;margin-bottom:10px;">' +
      'QR Code sudah digunakan.' +
      '</div>' +
      '<div class="detail" style="text-align:center;"><strong>Sudah dipakai check-in oleh:</strong></div>' +
      '<div class="detail" style="text-align:center;font-size:18px;font-weight:bold;margin:8px 0;">' +
      escapeHtml(dupName) +
      '</div>' +
      '<div class="detail" style="text-align:center;">' +
      escapeHtml(dupInstansi) +
      '</div>' +
      '<div class="detail" style="text-align:center;margin-top:12px;">' +
      escapeHtml(dupTime) +
      '</div>';

    showResult('warning', '✕ CHECK-IN TIDAK BERHASIL', dupContent);
    setStatus('Status: SUDAH DIGUNAKAN · siap scan berikutnya');
    vibrateWarn();

    lastResultKey =
      'ALREADY_CHECKED_IN|' +
      String(result.registrationId || '') +
      '|' +
      String(dupName);
    playImmediateResultFeedback('warn');
    return;
  }

  if (result.status === 'INVALID' || result.status === 'INVALID_STATUS') {
    showResult(
      'error',
      '✕ QR TIDAK VALID',
      escapeHtml(result.message || 'QR Token tidak ditemukan.')
    );
    setStatus('Status: TIDAK VALID · siap scan berikutnya');
    playBeep('failed');
    return;
  }

  showResult(
    'error',
    '✕ CHECK-IN TIDAK BERHASIL',
    escapeHtml(result.message || 'Silakan coba lagi.')
  );
  setStatus('Status: Gagal · siap scan berikutnya');
  playBeep('failed');
}

function resetScanner() {
  unlockAudio();
  readyForNextScan();
}

window.addEventListener('load', function () {
  startScanner();
});
</script>
</body>
</html>
